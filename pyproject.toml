[project]
name = "browser-sim"
version = "0.1.0"
description = "Monorepo for evaluating AI agent behaviors in controlled web environments"
# Both bounds are load-bearing. 3.12 is the only version this tree is known to
# build on, and the range declares exactly that rather than a wider claim
# nothing verifies. The ceiling excludes 3.13, where `playwright` 1.44.0 (via
# `libwebarena`) pins `greenlet` 3.0.3, which publishes no cp313 wheel and whose
# source build fails; 3.14 fails separately because `ray` publishes no cp314
# wheel. Widening the floor below 3.12 is untested, not known-broken.
#
# This is the single source of the Python floor. `.python-version` selects the
# same interpreter, `[tool.ruff]` infers `target-version` from this line rather
# than repeating it, and `[tool.mypy] python_version` tracks it by hand because
# mypy infers nothing.
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    # AgentLab (local)
    "agentlab",

    # BrowserGym ecosystem
    "browsergym-core>=0.14",
    "browsergym-experiments>=0.14",
    "browsergym-miniwob>=0.14",
    "browsergym-webarena>=0.14",
    "browsergym-visualwebarena>=0.14",
    "browsergym-workarena>=0.4",
    "browsergym-assistantbench>=0.14",

    # LLM clients
    "openai>=2.0",
    "anthropic>=0.69",
    "litellm>=1.75",

    # Web automation
    "beautifulsoup4>=4.12",
    "scrapybara>=2.5",
    "browserbase>=1.4",

    # Core
    "pydantic>=2.9",
    "numpy>=2.0",
    "pandas>=2.0",
    "torch>=2.2",
    "transformers>=4.38",
    "tiktoken>=0.7",

    # Ray & Dask
    "ray[default]>=2.10",
    "dask>=2024.1",
    "distributed>=2024.1",

    # HTTP & networking
    "httpx>=0.27",
    "requests>=2.31",
    "aiohttp>=3.9",

    # Flask & Gradio
    "flask>=3.0",
    "gradio>=5.5",

    # NLP
    "nltk>=3.8",
    "huggingface-hub>=0.20",

    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "contexttimer>=0.3",
    "gitpython>=3.1",
    "python-slugify>=8.0",
    "tqdm>=4.66",
    "joblib>=1.3",
    "beartype>=0.12",

    # Additional
    "gymnasium>=1.0",
    "text-generation>=0.7",
    "safetensors>=0.4",
    "matplotlib>=3.8",

    # WebArena
    "libwebarena>=0.0.4",
    "libvisualwebarena>=0.0.15",
]

# This table holds only genuinely optional *runtime* functionality. Developer
# tooling lives in [dependency-groups] `dev` below, not here — see the note on
# that table for why. There is deliberately no `dev` extra: an extra and a group
# of the same name are two independent lists that uv resolves differently, and
# keeping both is what let them drift apart previously.
[project.optional-dependencies]
# Local CUA model serving + DoM probe extraction.
# Install with `uv pip install -e '.[cua]'` on hosts that will run
# probe training, steering, or vLLM serving for OpenCUA / GUI-Owl.
#
# `vllm` previously declared `>=0.6`, which bounds nothing, and that is how an
# unreviewed 0.16.0 -> 0.23.0 move rode in on the lockfile fork collapse in
# #172. The bound below is what the unbounded spec actually resolves to, and it
# resolves *backwards*. Measured on 8804de42, `uv lock --upgrade` with
# `vllm>=0.6`:
#
#   vllm 0.20.2 · transformers 4.57.6 · torch 2.11.0
#
# 0.20.2 sits inside the Qwen3-VL deepstack regression window. vLLM introduced
# the fault at 0.20.0 and corrected it at 0.23.0. The floor keeps the resolver
# out of that range.
#
#   introduced  https://github.com/vllm-project/vllm/pull/40145
#   corrected   https://github.com/vllm-project/vllm/pull/43617
#
# The fault affects 0.20.0, 0.20.1, 0.20.2, 0.21.0, 0.22.0 and 0.22.1.
#
# Upstream measured the fault on Geo3K, 601 samples, at temperature 0. The
# tested models are Qwen3-VL-2B and Qwen3-VL-8B. The table below gives the
# accuracy before the correction, with the compiled graph on and off:
#
#   Qwen3-VL-2B   0.20466 compiled / 0.29118 eager   29.71% relative
#   Qwen3-VL-8B   0.52246 compiled / 0.54908 eager    4.85% relative
#
# The larger model shows the smaller effect. GUI-Owl-1.5-32B-Think is larger
# again, and upstream did not measure it. Read the two numbers above as the
# range that upstream observed. Do not read them as a prediction for this
# model.
#
# This tree does not reach the faulty path today, because no first-party code
# sends this model an image. The bound stays because that can change in one
# line. See docs/research/vllm-0-16-to-0-23-numerics-2026-08-17.md.
#
# The ceiling records why it cannot move forward instead, from package metadata
# on 2026-08-17 (`pypi.org/pypi/vllm/<version>/json`, `requires_dist`):
#
#   vllm 0.23.0   transformers!=5.0.*,...,!=5.5.0,>=4.56.0   torch==2.11.0
#   vllm 0.24.0   transformers>=5.5.3                        torch==2.11.0
#   vllm 0.27.1   transformers>=5.5.3                        torch==2.13.0
#
# 0.24.0 requires Transformers v5 outright -- its release notes file this under
# "Deprecated", but the metadata makes it a hard floor -- and the lock pins
# transformers 4.57.5. 0.27.1 additionally pins a torch this tree does not
# carry. 0.23.0 is the single release satisfying both the deepstack fix and
# Transformers v4.
#
# `transformers<5` guards a state the resolver can reach but does not choose
# today: vllm 0.23.0 dropped the `<5` ceiling that 0.16.0 carried and admits
# >=5.5.1, so a later resolve may raise transformers under the pinned vLLM.
# Transformers v5 stops OpenCUA at startup with `'OpenCUAProcessor' object has
# no attribute 'image_processor'`; the upstream fix, vllm-project/vllm#47438,
# has been a draft since 2026-07-02. Both bounds lift together once that lands.
#
# Full review, including the numerics findings:
# docs/research/vllm-0-16-to-0-23-numerics-2026-08-17.md
cua = [
    "vllm>=0.23,<0.24",
    "transformers<5",
    "qwen-vl-utils>=0.0.8",
    "accelerate>=0.30",
    "scikit-learn>=1.4",
]

# PEP 735 dependency groups (spec Final since 2024-10-10). This is the single
# source of truth for developer tooling.
#
# Groups rather than an extra, for three reasons:
#
#  * An extra is *published* dependency metadata — it describes what a consumer
#    of the distribution may opt into. Nothing here is for a consumer; pytest,
#    Black, Ruff, mypy and the notebook stack are local-only. uv states the
#    distinction directly: development dependencies "are local-only and will
#    not be included in the project requirements when published".
#  * An extra can only be requested through the project's own package name, so
#    it cannot exist without a package to hang it on. A group is independent of
#    packaging, which matters here because the root project has no
#    [build-system] and is never built or published.
#  * uv treats `dev` as a *default* group, so it is synced without any flag.
#    Previously `uv sync --locked` and `uv sync --locked --extra dev` produced
#    two different environments (246 vs 250 packages) because the extra's list
#    had grown four notebook entries the group's had not. One list cannot drift
#    from itself.
#
# Documented invocation is `uv sync --locked --group dev` — see
# eval_awareness_experiments/SETUP.md. `--group dev` is named explicitly rather
# than relying on the bare default so the command keeps installing this tooling
# even if a future `[tool.uv] default-groups` entry narrows the defaults.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-playwright>=0.5",
    "flaky>=3.8",
    "black[jupyter]>=24.0",
    "ruff>=0.15.12",
    "pre-commit>=3.6",
    # Upper bound is load-bearing: [tool.mypy] enables `warn_unused_ignores`, so
    # the targeted `# type: ignore[...]` suppressions in this tree must match the
    # checker that emitted them. A major release that stops emitting one of the
    # suppressed errors turns a stale ignore into a fresh failure.
    #
    # `<3` differs in kind from the `<2` it replaces. mypy 2.0 shipped in May
    # 2026 and 2.3 is current, so `<2` was excluding real releases and holding
    # the gate a major version behind; 3.0 does not exist, so `<3` excludes
    # none. The floor moves by mechanism rather than by memory: Dependabot
    # opens the bump as a PR against a green gate, which is precisely what
    # `<2` lacked.
    "mypy>=2.3,<3",
    # Typeshed stubs for PyYAML, which ships no inline `py.typed`. Without them
    # `import yaml` is an `import-untyped` error in five first-party modules.
    "types-PyYAML>=6.0",
    "ipython>=8.20",
    "ipykernel>=6.29",
    # Notebook execution stack, driven by the nbmake pytest plugin. Only nbmake
    # is strictly needed — it pulls nbclient and nbformat, and nbclient pulls
    # jupyter-client — but all four carry declared version floors here, as they
    # did in the extra this group replaces. Keeping them explicit means a floor
    # is enforced even if a future nbmake loosens or drops one of these edges.
    "jupyter-client>=8.9.1",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "nbmake>=1.5",
]

[tool.setuptools]
packages = ["probes", "models", "eval_awareness", "eval_awareness_experiments"]

[tool.uv.sources]
agentlab = { path = "AgentLab", editable = true }

[tool.black]
line-length = 100

# Exclusions are expressed as `force-exclude` rather than `exclude` or
# `extend-exclude`, for two separate reasons:
#
#  * A bare `exclude` REPLACES Black's built-in default exclusion set. The
#    previous value here did exactly that, so `.mypy_cache/`, `.pytest_cache/`,
#    `.ruff_cache/`, `.tox/`, `.nox/`, `.hg/`, `.svn/`, `.direnv/`,
#    `.ipynb_checkpoints/`, `__pypackages__/`, `buck-out/` and `venv/` were all
#    left formattable. Leaving `exclude` unset restores those defaults, which is
#    also why `.eggs/`, `.git/`, `.venv/`, `_build/`, `build/` and `dist/` no
#    longer need to be named below — Black already excludes them.
#  * `extend-exclude` filters only Black's recursive directory walk. A path
#    passed explicitly — by a pre-commit hook, an editor's format-on-save, or
#    `black some/file.py` — bypasses it entirely. `force-exclude` applies in
#    both cases and is otherwise identical to `exclude`, so it needs no
#    companion `extend-exclude`.
#
# The list mirrors [tool.ruff] `extend-exclude` below so both tools see the same
# 96 first-party Python files. Without it, `black .` from the repo root rewrites
# 21 files under `AgentLab/` — a vendored upstream tree CLAUDE.md marks
# read-only — and 62 under `packages/`, which is formatted by `ruff format`
# through its own config and never by Black.
#
# `vendors/`, `.claude/` and `.codex-worktrees/` are ignored in a working clone
# only via `.git/info/exclude`, which is per-clone and unversioned, so they must
# be named here to stay excluded for every checkout.
force-exclude = '''
/(
    AgentLab            # vendored upstream tree, read-only reference
  | vendors             # vendored upstream sources, read-only reference
  | packages            # warp-taskgen formats with `ruff format`, not Black
  | worldsim            # retired namespace; HTML/PNG fixtures only
  | notebooks           # imported DoomArena tutorial notebook, not first-party
  | webarena            # local WebArena clone; carried over from the old exclude
  | \.claude/worktrees  # agent topic worktrees
  | \.codex-worktrees   # agent topic worktrees
)/
'''

# Root lint gate for the evaluation-awareness study tree (`eval_awareness/`,
# `eval_awareness_experiments/`, `models/`, `probes/`, and the root-level
# runner scripts). Black above stays authoritative for formatting; Ruff is
# lint-only here, so there is deliberately no [tool.ruff.format] section.
#
# Ruff resolves configuration hierarchically and does not merge a child config
# into its parent, so `packages/warp-taskgen/pyproject.toml` keeps its own
# stricter settings (py312, its own excludes) without any `extend =` here.
[tool.ruff]
line-length = 100        # match [tool.black]
# `target-version` is deliberately absent. Ruff's docs prefer inferring it from
# `project.requires-python` -- "it's based on Python packaging standards, and
# will be respected by other tools" -- and an inferred value cannot drift from
# the floor the way a hand-maintained copy did. `>=3.12,<3.13` infers py312.

# `extend-exclude` adds to Ruff's built-in default excludes; a bare `exclude`
# would replace them and start linting `.venv/`, `dist/`, `node_modules/`, ...
extend-exclude = [
    "AgentLab/",          # vendored upstream tree, read-only reference
    "vendors/",           # vendored upstream sources, read-only reference
    "packages/",          # warp-taskgen owns its own [tool.ruff] config
    "worldsim/",          # retired namespace, stale local build artifacts only
    "dist/",              # built wheels/sdists (also a Ruff default)
    "notebooks/",         # imported tutorial notebook; no formatter owns it
    ".claude/worktrees/", # agent topic worktrees
    ".codex-worktrees/",  # agent topic worktrees
]

# Apply the exclusions above even when a path is passed explicitly, so
# pre-commit hooks and CI that hand Ruff a file list behave like `ruff check .`.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes — undefined names, unused imports
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear — mutable defaults, bare except, etc.
    "UP",  # pyupgrade — modernize syntax for the target version
    "I",   # isort — import sorting
    "ISC", # implicit string concat — catches accidental bugs
    "RUF", # ruff-native rules — additional opinionated checks
]
ignore = [
    "E501",   # line length (the formatter handles this)
    "ISC001", # conflicts with the formatter
    # `l` is used throughout probes/ as the layer index, matching the notation
    # in the surrounding comments and the papers this code reproduces.
    # Renaming 22 sites in analysis code is a behavior-adjacent change that
    # does not belong in a lint-config change; revisit as separate follow-up.
    "E741",
]

# Match warp-taskgen: keep F401 reported but never auto-deleted. An agent that
# adds an import in one edit and its usage in the next would otherwise lose the
# import to `--fix` in the gap and land a NameError.
unfixable = ["F401"]

# Non-ASCII characters that are intentional notation in this tree, not typos.
# Without these, RUF001/RUF002/RUF003 fire 44 times on real math and prose.
allowed-confusables = [
    "×", # U+00D7 MULTIPLICATION SIGN — grid/tensor shapes, e.g. "6×4 grid"
    "−", # U+2212 MINUS SIGN — negative indices and vector arithmetic in prose
    "α", # U+03B1 GREEK SMALL LETTER ALPHA — steering coefficient
    "–", # U+2013 EN DASH — range in a judge prompt string; editing that string
         #                  would change the prompt the judge model receives
]

[tool.ruff.lint.per-file-ignores]
# Runner and probe entry points bootstrap `sys.path` (and, for the DoomArena
# and WASP runners, `os.environ`) before importing first-party or benchmark
# modules, so their imports cannot all sit at the top of the file.
"eval_awareness_experiments/run_*.py" = ["E402"]
"eval_awareness_experiments/wasp_post_hoc_evaluator.py" = ["E402"]
"probes/score_probe.py" = ["E402"]
"probes/train_probe.py" = ["E402"]
"probes/validate_probes_cross.py" = ["E402"]
# Defers its first-party imports below module-level debug helpers. Hoisting
# them is a code move rather than a lint fix; tracked as follow-up.
"eval_awareness_experiments/experiments/comparative.py" = ["E402"]

[tool.ruff.lint.isort]
# Keep `from x import (a, b as c)` on one statement instead of splitting each
# aliased member into its own `from x import ...`, which is how this tree
# already writes them.
combine-as-imports = true
known-first-party = [
    "eval_awareness",
    "eval_awareness_experiments",
    "models",
    "probes",
]

# Root type gate for the evaluation-awareness study tree. The scope below
# resolves to exactly the same 96 first-party Python files that [tool.black]
# `force-exclude` and [tool.ruff] `extend-exclude` select, so all three tools
# agree on what "the first-party tree" means.
#
# Scope is stated positively with `files` rather than negatively with `exclude`
# because mypy — unlike Ruff and Black — does not read `.gitignore`. An
# exclude-based scope would quietly start type-checking generated result trees
# (`results/`, `read_logs/`, `probes/trained/`) the moment one gained a `.py`
# file. Naming the roots keeps `mypy` with no arguments equivalent in scope to
# `ruff check .` and `black --check .`.
[tool.mypy]
files = [
    "eval_awareness",
    "eval_awareness_experiments",
    "models",
    "probes",
    "scripts",
    "inspect_comparative.py",
    "rerun_experiments.py",
]

# Tracks `requires-python` by hand. Unlike Ruff, mypy infers nothing from it,
# so this is the one copy of the floor that can drift -- if `requires-python`
# moves, move this with it. Measured on this commit with `check_untyped_defs`
# and `strict_equality` on: raising 3.10 -> 3.12 reports no new errors.
python_version = "3.12"

# First tier of mypy's documented adoption ratchet for an existing codebase.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Second tier. mypy's "Introduce stricter options" ladder lists `strict_equality`
# next to the `warn_*` tier and `check_untyped_defs` on the rung after it, both
# before the `disallow_*` family; the `disallow_*` family is still off.
#
# `check_untyped_defs` is the one the docs mark "strongly recommend enabling
# this one as soon as you can", and it is the single largest coverage change
# available here: without it mypy skips the *body* of every function that has
# no annotations, which in this tree is most of them. It needs no new
# annotations — unannotated parameters stay `Any`, only the statements inside
# get checked.
#
# `strict_equality` rides along because adopting it costs nothing extra now, not
# because the docs pair the two. Measured on this commit: it reports zero on its
# own, and four more once `check_untyped_defs` exposes the untyped bodies (all
# `[comparison-overlap]`, all in `judges/test_purpose_continue_5q.py`, all from
# one stubbed model object). Taking the adjacent rung in the same change spends
# one review rather than two.
check_untyped_defs = true
strict_equality = true

# Every suppression in this tree is written as `# type: ignore[<code>]` with a
# reason. `warn_unused_ignores` above makes those suppressions version-
# sensitive: a mypy release that stops emitting one of the suppressed errors
# turns the now-stale ignore into a fresh failure. That is why the dev
# dependency pins `mypy>=2.3,<3` rather than an unbounded floor, which would let
# the gate's meaning drift with each release. See the comment beside that pin
# for why the bound moves by Dependabot rather than by memory.

# --------------------------------------------------------------------------
# Per-module import overrides.
#
# There is deliberately NO global `ignore_missing_imports`. mypy's docs call it
# equivalent to a blanket `# type: ignore` on every unresolved import, and here
# it would also silence numpy, torch, playwright, pydantic, transformers,
# matplotlib, openai, anthropic and litellm — all of which ship an inline
# `py.typed` marker and are genuinely type-checked by this gate. Each override
# below names only libraries that cannot be resolved, with the reason.
# --------------------------------------------------------------------------

# Neither ships a `py.typed` marker and neither has a typeshed stub package.
# scikit-learn additionally lives in the optional `cua` extra, so it is absent
# from a plain `--extra dev` environment.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

# pandas ships no `py.typed`; its stubs are the separate `pandas-stubs`
# distribution. It is imported in exactly one module here
# (`eval_awareness_experiments/run_wasp.py`), whose other imports are
# unresolvable benchmark runtimes in any case, so adding `pandas-stubs` to the
# dev dependencies would buy no real coverage today. Revisit if pandas use
# spreads beyond that runner.
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

# Benchmark runtimes that are installed only on configured benchmark hosts, not
# in a developer or CI `--extra dev` environment. They are imported by the
# `run_*.py` entry points, which already bootstrap `sys.path` before importing
# them (see the E402 per-file-ignores above).
[[tool.mypy.overrides]]
module = [
    "agentdojo.*",
    "bgym.*",
    "browsergym.*",
    "doomarena.*",
    "webarena.*",
    "webarena_prompt_injections.*",
]
ignore_missing_imports = true

# AgentLab is the vendored upstream tree CLAUDE.md marks read-only, and it is
# installed as an editable `.pth` path that mypy does not follow. `follow_imports`
# is pinned to "skip" as well as ignoring the missing import so that the gate
# never starts type-checking the vendored sources if that install becomes
# resolvable — excluding it from `files` alone would not prevent that, because
# `exclude` does not apply to modules reached through an import.
[[tool.mypy.overrides]]
module = ["agentlab.*"]
follow_imports = "skip"
ignore_missing_imports = true

# There is deliberately no per-module opt-out for `check_untyped_defs`. Measured
# under mypy 2.3.1: 14 errors across four files —
# `judges/test_purpose_continue_5q.py` (3), `llm.py` (2),
# `run_doomarena_pipeline.py` (7) and `tool_calling_runner.py` (2) — plus 4 more
# from `strict_equality`, all in the first of those. All 18 were resolved in the
# source rather than silenced here.
#
# Where the ratchet stops, and the rule governing the per-module `disallow_*`
# overrides below, are recorded in
# `docs/adr/0005-stop-the-type-checking-ratchet-at-a-stated-line.md`.

# --------------------------------------------------------------------------
# Per-module `disallow_untyped_defs` — the last rung of the ratchet.
#
# ADR 0005 holds the policy and the reason the climb stops here. Its rule: a
# module imported by ten or more other first-party modules earns
# `disallow_untyped_defs`, because annotating a widely imported module improves
# checking in every module that imports it, which a rarely imported one cannot.
#
# Membership is measured rather than argued. Counting first-party importers on
# 1adf7f56:
#
#     grep -rhn "^from eval_awareness_experiments\.\|^from eval_awareness\." \
#       --include="*.py" eval_awareness eval_awareness_experiments probes \
#       models scripts \
#       | sed -E 's/.*from (eval_awareness[a-z_]*\.[a-zA-Z_.]+) import.*/\1/' \
#       | sort | uniq -c | sort -rn
#
#   types 20 · llm 16 · system_prompt_frame 10 · injection_modifier 10 ·
#   judges.base 8
#
# Every module at or above the threshold is listed below; `judges.base` at 8 is
# the nearest one outside it. ADR 0005 records `llm` at 15, measured on the
# commit that accepted it; #160 and #172 have since added an importer each. The
# current count lives here rather than being corrected there, because a number
# that moves whenever an import lands is a measurement, not an accepted
# decision — the same reason the ADR keeps the mypy pin out of itself.
#
# Annotation cost, measured with
# `uv run mypy --disallow-untyped-defs <files>`: `types.py`,
# `system_prompt_frame.py` and `injection_modifier.py` were already clean, so
# they join at zero cost. `llm.py` needed two return annotations, on the
# retried request closures in `generate` and `generate_with_images`; both were
# annotated in the source (`-> ChatCompletion`), which also binds the generic
# `call_with_retry` so `resp.choices[0].message.content` is checked instead of
# `Any`. Nothing is silenced here.
#
# These overrides are scoped to the modules they name and do not follow
# imports. The global `--disallow-untyped-defs` flag used for the measurement
# above also reports `models/common/vllm_client.py:46`
# (`make_agentlab_chat_model_args`), reached as a followed import from
# `llm.py`; the overrides below do not, and that module is deliberately not in
# the durable set.
# --------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    "eval_awareness_experiments.types",
    "eval_awareness_experiments.llm",
    "eval_awareness_experiments.system_prompt_frame",
    "eval_awareness_experiments.injection_modifier",
]
disallow_untyped_defs = true
